[pytest]
# Anchor pytest's rootdir here (instead of letting it default to the repo
# root via .git) so that collecting these tests does not walk pytest's
# collection tree through bindings/python/__init__.py, which unconditionally
# does `from gnucash.gnucash_core import *` and therefore requires a built
# GnuCash with Python bindings. These tests are pure Python and must be
# collectible/runnable without that module (see tests/test_plan.py).
addopts = --import-mode=importlib
