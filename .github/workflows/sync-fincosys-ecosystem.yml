name: Sync fincosys ecosystem

# Manual only. This never runs on a schedule and, by default, only
# validates the sync -- it does not write or commit anything. Producing and
# committing a real data snapshot requires explicitly setting `write: true`
# on a manual run, consistent with this ecosystem's convention of gating
# real data-sync operations behind an explicit, reviewable step (see
# cogpy/fincosys's CLAUDE.md, "Running-Balance Continuity & Corpus Sync").
on:
  workflow_dispatch:
    inputs:
      write:
        description: "Persist data/fincosys_sync/*.json and open a PR (unchecked = dry run only)"
        type: boolean
        default: false
      entity_filter:
        description: "Space-separated fincosys entity codes to restrict to (blank = all)"
        type: string
        default: ""
      entity_repos:
        description: "Entity repositories to scan for QuickBooks/Shopify commerce records (space-separated owner/repo; blank = skip commerce)"
        type: string
        default: >-
          fincosys/entity-regima-dr-h-uk fincosys/entity-rzl
          fincosys/entity-reu fincosys/entity-rzi fincosys/entity-uni
          fincosys/entity-rsa fincosys/entity-rwd cogpy/entity-drhw

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      ECOSYSTEM_SYNC_CHECKOUT_TOKEN: ${{ secrets.ECOSYSTEM_SYNC_TOKEN || github.token }}
    steps:
      - name: Checkout gnucashm
        uses: actions/checkout@v4
        with:
          path: gnucashm

      # Sibling repos are private and cross-repo -- this requires a
      # personal access token with read access to them, stored as
      # ECOSYSTEM_SYNC_TOKEN. When that secret isn't configured, fall
      # back to github.token so public sibling repos still check out.
      - name: Checkout accospace
        uses: actions/checkout@v4
        with:
          # Formerly RegimA-Zone/fincosys-atomspace-builder; the AtomSpace
          # builder now lives at fincosys/accospace, alongside the rest of
          # the fincosys org. The Python package it installs is unchanged
          # (fincosys-atomspace-builder, importable as atomspace_builder),
          # so only the checkout location moves.
          repository: fincosys/accospace
          token: ${{ env.ECOSYSTEM_SYNC_CHECKOUT_TOKEN }}
          path: accospace

      - name: Checkout fincosys
        uses: actions/checkout@v4
        with:
          repository: cogpy/fincosys
          token: ${{ env.ECOSYSTEM_SYNC_CHECKOUT_TOKEN }}
          path: fincosys

      - name: Checkout helix
        uses: actions/checkout@v4
        with:
          repository: fincosys/helix
          token: ${{ env.ECOSYSTEM_SYNC_CHECKOUT_TOKEN }}
          path: helix
        continue-on-error: true # helix holds no financial records; optional

      - name: Checkout revstream1
        uses: actions/checkout@v4
        with:
          repository: cogpy/revstream1
          token: ${{ env.ECOSYSTEM_SYNC_CHECKOUT_TOKEN }}
          path: revstream1
        continue-on-error: true # only needed for case-evidence enrichment

      # Commerce records (QuickBooks/Shopify, schema
      # fincosys-commerce-sync/v1) live in the entity repositories rather
      # than under fincosys's data/, so they need their own checkouts. The
      # default list is the repositories currently known to hold a record
      # document; scanning all forty-odd would check out the whole corpus to
      # read eight files. Each is optional -- the scan skips a repository
      # that is not there, and a run with none of them simply carries no
      # commerce records, which is what every run did before this input
      # existed.
      - name: Checkout entity repositories holding commerce records
        if: ${{ inputs.entity_repos != '' }}
        run: |
          set -u
          mkdir -p entity-repos
          for slug in ${{ inputs.entity_repos }}; do
            name="${slug##*/}"
            if git clone --depth 1 \
                 "https://x-access-token:${ECOSYSTEM_SYNC_CHECKOUT_TOKEN}@github.com/${slug}.git" \
                 "entity-repos/${name}" 2>/dev/null; then
              echo "checked out ${slug}"
            else
              # Not fatal: these repositories are private and access is
              # granted per repository, so a missing grant must not fail the
              # whole sync. The run reports what it scanned.
              echo "::warning::could not check out ${slug}; its commerce records will be absent from this sync"
            fi
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install accospace (fincosys-atomspace-builder)
        run: pip install -e ./accospace

      - name: Run sync (dry run unless write=true)
        working-directory: gnucashm
        run: |
          ARGS=(
            --atomspace-builder-dir ../accospace
            --fincosys-data-dir ../fincosys/data
            --helix-manifest ../helix/ecosystem/related_artifacts.json
            --revstream1-data-dir ../revstream1/data_models
            --verbose
          )
          if [ -n "${{ inputs.entity_repos }}" ] && [ -d ../entity-repos ]; then
            ARGS+=(--entity-repos-root ../entity-repos)
          fi
          if [ -n "${{ inputs.entity_filter }}" ]; then
            ARGS+=(--entity-filter ${{ inputs.entity_filter }})
          fi
          if [ "${{ inputs.write }}" = "true" ]; then
            ARGS+=(--write)
          fi
          python scripts/sync_fincosys_ecosystem.py "${ARGS[@]}"

      - name: Open PR with synced data
        if: ${{ inputs.write == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          path: gnucashm
          commit-message: "chore: refresh fincosys ecosystem sync snapshot"
          branch: bot/fincosys-ecosystem-sync
          delete-branch: true
          draft: true
          title: "Refresh fincosys ecosystem sync snapshot"
          body: |
            Automated refresh of `data/fincosys_sync/` via
            `scripts/sync_fincosys_ecosystem.py`, triggered manually from
            the Sync fincosys ecosystem workflow.

            This snapshot includes helix-sourced nodes tagged
            `unverified_self_reported` -- see
            `docs/FINCOSYS_ECOSYSTEM_SYNC.md` before treating any figure in
            it as verified case evidence.
